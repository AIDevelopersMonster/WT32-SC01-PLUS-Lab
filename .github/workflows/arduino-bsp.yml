name: Arduino BSP CI

on:
  workflow_call:

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 Arduino core
        run: |
          arduino-cli config init
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.8 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Install example dependencies
        run: arduino-cli lib install "lvgl@8.3.11"
      - name: Compile Arduino examples 01-17 and 19
        run: |
          for example in \
            01_DisplayTest 02_TouchTest 03_StorageTest 04_SDDestructiveTest 05_AudioTest \
            06_RS485Test 07_IOTest 08_WiFiTest 09_BLETest 10_TestConsole 11_RainbowTouch \
            12_RetroClock 13_LVGL_BasicUI 14_LVGL_NavigationShell 15_LVGL_DeviceInfo \
            16_LVGL_ThemeSwitch 17_LVGL_SettingsPersistence 19_LVGL_Orientation; do
            echo "Compiling $example"
            arduino-cli compile \
              --fqbn esp32:esp32:esp32s3 \
              --library libraries/WT32_SC01_PLUS \
              "libraries/WT32_SC01_PLUS/examples/$example"
          done
      - name: Compile QR lifecycle with Panlee QSPI PSRAM and 16 MB app layout
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:PSRAM=enabled,FlashSize=16M,PartitionScheme=default_16MB \
            --library libraries/WT32_SC01_PLUS \
            libraries/WT32_SC01_PLUS/examples/18_LVGL_QR_Lifecycle
      - name: Compile GitHub OTA with Panlee 16 MB dual-slot profile
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:PSRAM=enabled,FlashSize=16M \
            --library libraries/WT32_SC01_PLUS \
            libraries/WT32_SC01_PLUS/examples/20_LVGL_GitHubOTA
      - name: Compile Widget Loader with Panlee 16 MB LittleFS profile
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:PSRAM=enabled,FlashSize=16M,PartitionScheme=default_16MB \
            --library libraries/WT32_SC01_PLUS \
            libraries/WT32_SC01_PLUS/examples/21_LVGL_WidgetLoader
