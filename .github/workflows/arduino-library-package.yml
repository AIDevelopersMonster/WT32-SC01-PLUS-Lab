name: Arduino Library Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'arduino-v*'
    paths:
      - 'libraries/WT32_SC01_PLUS/**'
      - '.github/workflows/arduino-library-package.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read library version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep '^version=' libraries/WT32_SC01_PLUS/library.properties | cut -d= -f2)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Build Arduino ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package
          mkdir -p package/WT32_SC01_PLUS
          cp -a libraries/WT32_SC01_PLUS/. package/WT32_SC01_PLUS/
          rm -f package/WT32_SC01_PLUS/examples/08_WiFiTest/wifi_secrets.h
          cd package
          zip -r "../WT32_SC01_PLUS-Arduino-v${{ steps.version.outputs.version }}.zip" WT32_SC01_PLUS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: WT32_SC01_PLUS-Arduino-v${{ steps.version.outputs.version }}
          path: WT32_SC01_PLUS-Arduino-v${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

      - name: Publish GitHub Release asset for Arduino tag
        if: startsWith(github.ref, 'refs/tags/arduino-v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ASSET="WT32_SC01_PLUS-Arduino-v${{ steps.version.outputs.version }}.zip"
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --title "WT32_SC01_PLUS Arduino v${{ steps.version.outputs.version }}" \
              --notes "Install in Arduino IDE using Sketch -> Include Library -> Add .ZIP Library..."
          fi
