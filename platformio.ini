[platformio]
default_envs = wt32-sc01-plus-bootstrap

[env:wt32-sc01-plus-bootstrap]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
upload_speed = 460800
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -D WT32_SC01_PLUS_LAB=1

; Bootstrap only.
; Display/touch pin definitions are deliberately not hard-coded here until
; the Panlee ZX3D50CE08S-V15-USRC specimen has passed hardware identification.
